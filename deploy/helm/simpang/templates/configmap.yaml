apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "simpang.configName" . }}
  labels:
    {{- include "simpang.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.app.port | quote }}
  {{- with .Values.config.ollamaBaseUrl }}
  OLLAMA_BASE_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.vllmBaseUrl }}
  VLLM_BASE_URL: {{ . | quote }}
  {{- end }}
