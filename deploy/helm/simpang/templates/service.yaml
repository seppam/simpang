apiVersion: v1
kind: Service
metadata:
  name: {{ include "simpang.fullname" . }}
  labels:
    {{- include "simpang.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "simpang.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
