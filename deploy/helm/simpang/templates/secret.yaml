{{- if not .Values.existingSecret }}
{{- if and .Values.postgres.enabled (not .Values.postgres.password) }}
{{- fail "postgres.password must be set when postgres.enabled is true (or set existingSecret)" }}
{{- end }}
{{- $databaseUrl := .Values.secrets.databaseUrl }}
{{- /* JWT signing secret for admin tokens: given value, else keep the one already in the
       cluster (so upgrades do not log everyone out), else generate a random one. */}}
{{- $jwtSecret := .Values.secrets.jwtSecret }}
{{- if not $jwtSecret }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "simpang.secretName" .) }}
{{- if and $existing $existing.data $existing.data.JWT_SECRET }}
{{- $jwtSecret = $existing.data.JWT_SECRET | b64dec }}
{{- else }}
{{- $jwtSecret = randAlphaNum 48 }}
{{- end }}
{{- end }}
{{- if and (not $databaseUrl) .Values.postgres.enabled }}
{{- $databaseUrl = printf "postgres://%s:%s@%s:5432/%s" .Values.postgres.user .Values.postgres.password (include "simpang.postgresName" .) .Values.postgres.database }}
{{- end }}
# Helm hook (weight -20) so the migration Job, which also runs as a hook, can read it.
# before-hook-creation keeps it in place after the install finishes, so the Deployment can use it.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "simpang.secretName" . }}
  labels:
    {{- include "simpang.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  DATABASE_URL: {{ $databaseUrl | quote }}
  GROQ_API_KEY: {{ .Values.secrets.groqApiKey | quote }}
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | quote }}
  OPENROUTER_API_KEY: {{ .Values.secrets.openrouterApiKey | quote }}
  HF_TOKEN: {{ .Values.secrets.hfToken | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  JWT_SECRET: {{ $jwtSecret | quote }}
  {{- if .Values.postgres.enabled }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  {{- end }}
{{- end }}
