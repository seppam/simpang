# Runs the database migrations before every install and upgrade.
# Order of hooks: postgres (-10, dev only) and the Secret (-20) are created first, then this Job (0).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "simpang.fullname" . }}-migrate
  labels:
    {{- include "simpang.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "simpang.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        {{- include "simpang.podSecurityContext" . | nindent 8 }}
      initContainers:
        # The database may still be starting (in-cluster Postgres), so wait for its TCP port first.
        - name: wait-for-db
          image: {{ include "simpang.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - node
            - -e
            - |
              const net = require('node:net');
              const url = new URL(process.env.DATABASE_URL);
              const port = Number(url.port || 5432);
              const tryConnect = () => new Promise((resolve) => {
                const socket = net.connect(port, url.hostname);
                socket.once('connect', () => { socket.end(); resolve(true); });
                socket.once('error', () => resolve(false));
              });
              (async () => {
                for (let i = 0; i < {{ max (div .Values.migration.waitTimeoutSeconds 2) 1 }}; i++) {
                  if (await tryConnect()) { console.log('database is accepting connections'); process.exit(0); }
                  await new Promise((r) => setTimeout(r, 2000));
                }
                console.error('database is not reachable'); process.exit(1);
              })();
          env:
            {{- include "simpang.databaseUrlEnv" . | nindent 12 }}
          securityContext:
            {{- include "simpang.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: migrate
          image: {{ include "simpang.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - node
            - src/db/migrate-cli.ts
          env:
            {{- include "simpang.databaseUrlEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- include "simpang.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
